<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <head>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    </head>
    
</head>
<body>
  <header>
    <div class="header-container">
        <h1>WalkWoof</h1>

    </div>
  </header>
    <div class="login-container">
        <div class="login-box">
        <h2>Qual é o seu número de telefone ou e-mail?</h2>
        <form (ngSubmit)="onLogin()">
          <div class="login-input">
            <input type="text" [(ngModel)]="emailOrPhone" name="emailOrPhone" placeholder="Informar e-mail ou telefone" required />
          </div>
          <button type="submit" class="login-button">Continuar</button>
        </form>
        <div class="separator">ou</div>
        <button (click)="onGoogleLogin()" class="google-button">
          <img src="assets/google-icon.png" alt="google icon" class="google-icon" />
            Continuar com o Google 
        </button>
        </div>
      </div>
      
</body>
</html>
