<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <header>
    <div class="header-container">
        <h1>WalkWoof</h1>
      
    </div>
  </header>
    <div class="login-container">
        <div class="login-box">
        <h2>Qual é o seu número de telefone ou e-mail?</h2>
        <form (ngSubmit)="onLogin()">
          <div class="login-input">
            <input type="text" [(ngModel)]="emailOrPhone" name="emailOrPhone" placeholder="Informar e-mail ou telefone" required />
          </div>
          <button type="submit" class="login-button">Continuar</button>
        </form>
        </div>
      </div>
      <p>Hi</p>
</body>
</html>
